<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Links -->
    <link rel="icon" href="./favicons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="stylesheet" href="./css/style.css">

    <!-- Main JS -->
    <script defer src="./js/main.js"></script>

    <title>Pokédex</title>
</head>

<body>

    <main>
        <div class="pokedex">
            <img src="./images/pokedex.png" alt="Pokédex" class="pokedex__image">

            <div class="pokemon__screen"></div>
            <h1 class="pokemon__data">
                <span class="pokemon__number"></span>
                <span class="pokemon__name"></span>
            </h1>

            <form class="form__search">
                <input type="search" class="input__search" placeholder="Name or Number" required />
            </form>

            <div class="buttons">
                <button class="btn-prev">Previous &lt;</button>
                <button class="btn-next">Next &gt;</button>
            </div>

            <img alt="pokemon" class="pokemon__image" style="display: none">

        </div>
    </main>

</body>

</html>
